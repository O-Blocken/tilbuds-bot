---
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # paddlepaddle ships wheels only up to cp313, so a newer Python base image
      # cannot install the OCR runtime (see pyproject.toml). Drop this once
      # paddle publishes cp314 wheels.
      - dependency-name: "python"
        versions: [">= 3.14"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
