# Konceptregister for tilbudssøgningen.
#
# Hvert [[concepts]]-blok beskriver ét koncept:
#   name        - søgeordet brugere skriver (fx "øl")
#   description - valgfri note til dokumentation
#   aliases     - synonymer, stavevarianter, mærker, produktnavne
#   refs        - navne på andre koncepter, hvis aliases også hører til her
#
# Aliases normaliseres ved indlæsning (små bogstaver, diakritik foldes:
# æ->ae, ø->oe, å->aa), så "coca-cola", "COCA COLA" og "coca cola" er ens.
# Referencer må danne cykler; udvidelsen er cykelsikker.
#
# Principper fra de rigtige tilbudsdata (føtex + SPAR, uge 42):
#   - Brands holdes som egne koncepter og bindes via refs, så en søgning
#     på "coca cola" ikke udvider til alt sodavand.
#   - Farlige korte ord afstemmes mod faktiske tilbudstekster: "rose" er
#     bevidst ikke et vin-alias (ROSE er et kyllingemærke i dataene),
#     "tuborg" er bevidst ikke et øl-alias (Tuborg Squash er sodavand).
#   - Udelukkelser bruger samme udvidelse: "øl -julekalender" afviser
#     enhver adventskalender, også dem med "julekalender" i navnet.

[[concepts]]
name = "øl"
description = "Øl og øltyper. Søg 'øl -julekalender' for øl uden adventskalendere."
aliases = ["øl", "pilsner", "lager", "bajer", "fadøl", "hvedeøl", "classic øl", "ølflasker", "specialøl", "julebryg", "påskebryg", "hvidtøl", "heineken", "leffe", "corona", "hoegaarden", "singha", "asahi"]
refs = ["carlsberg", "tuborg", "grimbergen", "kronenbourg", "jacobsen"]

